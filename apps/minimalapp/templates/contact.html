<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}" />
    <title>問い合わせフォーム</title>
  </head>
  <body>
    <h2>お問合せフォーム</h2>
    <form action="{{ url_for('contact_complete') }}" method="POST" novalidate="novalidate">
      <table>
        <tr>
          <th>お名前</th>
          <td>
            <input type="text" name="name" value="{{ username }}" placeholder="ユーザー名" />
          </td>
        </tr>
        <tr>
          <th>メールアドレス</th>
          <td>
            <input type="email" name="email" value="{{ email }}" placeholder="メールアドレス" />
          </td>
        </tr>
        <tr>
          <th>問い合わせ内容</th>
          <td>
            <textarea name="description" placeholder="問い合わせ内容">{{ description }}</textarea>
          </td>
        </tr>
      </table>
      <input type="submit" value="問い合わせ" />
    </form>
  </body>
</html>
